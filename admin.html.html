<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة مشروع سمنت الامير - مسؤول البوابة</title>
  
  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --primary-blue: #0288d1;
      --primary-dark: #004ecb;
      --primary-deep: #0a192f;
      --accent-cyan: #00d2ff;
      --bg-gradient: #f0f4f9;
      --card-white: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --danger-red: #ef4444;
      --warning-amber: #f59e0b;
      --success-green: #10b981;
    }

    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg-gradient); color: var(--text-dark); padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

    .mobile-card {
      background: var(--card-white);
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      position: relative;
    }

    .header-box {
      text-align: center;
      padding-bottom: 15px;
      margin-bottom: 15px;
      border-bottom: 2px solid #f1f5f9;
    }
    .header-box img { width: 65px; height: 65px; border-radius: 50%; border: 2px solid var(--accent-cyan); margin-bottom: 6px; object-fit: cover; }
    .header-box h2 { font-size: 16px; font-weight: 900; color: var(--primary-deep); }
    .header-box h3 { font-size: 13px; font-weight: 800; color: var(--primary-blue); }

    /* تنبيه الممنوعين الحاد */
    #ban-alert-box {
      display: none;
      background: #fef2f2;
      border: 2px solid var(--danger-red);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 15px;
      text-align: center;
      animation: shake 0.3s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    #ban-alert-box h4 { color: var(--danger-red); font-size: 14px; font-weight: 900; }
    #ban-alert-box p { color: #991b1b; font-size: 12px; font-weight: 700; margin-top: 4px; }

    .form-group { margin-bottom: 12px; }
    label { font-size: 12.5px; font-weight: 700; color: var(--text-dark); margin-bottom: 5px; display: block; }
    input, select {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 13.5px;
      background: #f8fafc;
      transition: all 0.2s;
    }
    input:focus, select:focus { outline: none; border-color: var(--primary-blue); background: #fff; box-shadow: 0 0 0 3px rgba(2, 136, 209, 0.12); }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary-blue));
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(2, 136, 209, 0.25);
      transition: 0.2s;
    }
    .btn-submit:hover { opacity: 0.95; }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; }

    .officer-badge {
      background: rgba(2, 136, 209, 0.08);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px dashed var(--primary-blue);
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="mobile-card">
    <div class="header-box">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRqbnLfvVmHN8o_qHzk6iYB4Q1eYZnto2pQyAP3w-OKdRRDe3ATfcn9dWw&s=10" alt="Logo">
      <h2>شركة السد العظيم للأمن والحراسات</h2>
      <h3>🏗️ بوابة مشروع سمنت الامير</h3>
    </div>

    <!-- تحذير الممنوعين -->
    <div id="ban-alert-box">
      <h4>🚫 تحذير أمني: الاسم أو المركبة محظورة!</h4>
      <p id="ban-reason-text">سبب المنع: مدرج في قائمة الحظر المركزية</p>
    </div>

    <form id="gateForm">
      <!-- اسم مسؤول الباب -->
      <div class="officer-badge">
        <div class="form-group" style="margin-bottom: 0;">
          <label style="color: var(--primary-dark);">👮 اسم مسؤول الباب المكلف</label>
          <input type="text" id="officer-name" placeholder="أدخل اسمك الكامل..." required>
        </div>
      </div>

      <!-- الفئات السبع المعتمدة في المنصة -->
      <div class="form-group">
        <label>الفئة / نوع الحركة</label>
        <select id="g-cat" onchange="updateGateFields()">
          <option value="شاحنة حمل">🚛 شاحنة حمل</option>
          <option value="شاحنة نقل">🚚 شاحنة نقل</option>
          <option value="سيارة صغيرة">🚗 سيارة صغيرة</option>
          <option value="آليات">🚜 آليات</option>
          <option value="زائر">👤 زائر</option>
          <option value="عامل">👷 عامل</option>
          <option value="مقاول">🏗️ مقاول</option>
        </select>
      </div>

      <!-- اسم الشخص/السائق -->
      <div class="form-group">
        <label id="lbl-g-name">اسم السائق الثلاثي</label>
        <input type="text" id="g-name" placeholder="أدخل الاسم..." oninput="checkBannedStatus()" required>
      </div>

      <!-- رقم المركبة / الهوية -->
      <div class="form-group">
        <label id="lbl-g-num">رقم المركبة / الشاحنة</label>
        <input type="text" id="g-num" placeholder="الرقم..." oninput="checkBannedStatus()">
      </div>

      <!-- الحمولة / الملاحظات -->
      <div class="form-group">
        <label id="lbl-g-cargo">نوع الحمولة / المادة</label>
        <input type="text" id="g-cargo" placeholder="التفاصيل...">
      </div>

      <!-- الوجهة / الجهة المستلمة -->
      <div class="form-group">
        <label id="lbl-g-dest">الجهة المستلمة / الوجهة</label>
        <input type="text" id="g-dest" placeholder="الجهة القادم إليها...">
      </div>

      <button type="submit" id="btn-save" class="btn-submit">تأكيد وتسجيل الدخول للموقع</button>
    </form>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBY_BTqxCsfPTsMhU9YAE6yxn3ZxDOnGEs",
      authDomain: "portal-management-system.firebaseapp.com",
      databaseURL: "https://portal-management-system-default-rtdb.firebaseio.com",
      projectId: "portal-management-system",
      storageBucket: "portal-management-system.firebasestorage.app",
      messagingSenderId: "396326956695",
      appId: "1:396326956695:web:e290603d522a0f879683d2"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    let cacheBannedList = [];

    // جلب أسماء المحظورين من المنصة الرئيسية فورياً
    db.ref('banned_list').on('value', snap => {
      const data = snap.val() || {};
      cacheBannedList = Object.values(data);
    });

    // تحديث مسميات الحقول الديناميكية للفئات السبع
    function updateGateFields() {
      const cat = document.getElementById('g-cat').value;
      const lblName = document.getElementById('lbl-g-name');
      const lblNum = document.getElementById('lbl-g-num');
      const lblCargo = document.getElementById('lbl-g-cargo');
      const lblDest = document.getElementById('lbl-g-dest');

      if (cat === 'شاحنة حمل' || cat === 'شاحنة نقل') {
        lblName.innerText = "اسم السائق الثلاثي";
        lblNum.innerText = "رقم المركبة / الشاحنة";
        lblCargo.innerText = "نوع الحمولة / رقم المانفيست";
        lblDest.innerText = "الجهة المستلمة / الشركة الناقلة";
      } else if (cat === 'آليات') {
        lblName.innerText = "اسم المشغل / السائق";
        lblNum.innerText = "رقم / ترميز الآلية";
        lblCargo.innerText = "نوع الآلية (شفل، حفارة...)";
        lblDest.innerText = "القسم التابع له / الموقع";
      } else if (cat === 'سيارة صغيرة') {
        lblName.innerText = "اسم السائق / المسؤول";
        lblNum.innerText = "رقم السيارة / المحافظة";
        lblCargo.innerText = "عدد الركاب / ملاحظات الحمولة";
        lblDest.innerText = "المقصد / القسم الزائر له";
      } else if (cat === 'زائر') {
        lblName.innerText = "الاسم الكامل للزائر";
        lblNum.innerText = "رقم الهوية / الهاتف";
        lblCargo.innerText = "سبب الزيارة / طبيعة العمل";
        lblDest.innerText = "الجهة القادم إليها / المسؤول";
      } else if (cat === 'عامل' || cat === 'مقاول') {
        lblName.innerText = "الاسم الكامل";
        lblNum.innerText = "رقم الهوية / الهاتف";
        lblCargo.innerText = "المسمى الوظيفي / الاختصاص";
        lblDest.innerText = "اسم الشركة / المقاولة / موقع العمل";
      }
      checkBannedStatus();
    }

    // التحقق اللحظي من الحظر أثناء الكتابة
    function checkBannedStatus() {
      const nameVal = document.getElementById('g-name').value.trim().toLowerCase();
      const numVal = document.getElementById('g-num').value.trim().toLowerCase();
      const alertBox = document.getElementById('ban-alert-box');
      const btnSave = document.getElementById('btn-save');
      const reasonText = document.getElementById('ban-reason-text');

      if (!nameVal && !numVal) {
        alertBox.style.display = 'none';
        btnSave.disabled = false;
        return;
      }

      const foundBan = cacheBannedList.find(item => {
        const matchName = item.name && nameVal && item.name.toLowerCase().includes(nameVal);
        const matchNum = item.num && numVal && item.num.toLowerCase().includes(numVal);
        return matchName || matchNum;
      });

      if (foundBan) {
        alertBox.style.display = 'block';
        reasonText.innerText = `سبب المنع: ${foundBan.reason || 'مدرج في قائمة الحظر المركزية'}`;
        btnSave.disabled = true;
      } else {
        alertBox.style.display = 'none';
        btnSave.disabled = false;
      }
    }

    // إرسال الحركات المباشرة للمنصة الرئيسية
    document.getElementById('gateForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const officer = document.getElementById('officer-name').value.trim();
      const name = document.getElementById('g-name').value.trim();

      if (!officer) return alert('يرجى كتابة اسم مسؤول الباب أولاً');
      if (!name) return alert('يرجى ادخال الاسم الكامل');

      const payload = {
        officer: officer,
        cat: document.getElementById('g-cat').value,
        f1: name,
        f2: document.getElementById('g-num').value.trim(),
        f3: document.getElementById('g-dest').value.trim(),
        f4: document.getElementById('g-cargo').value.trim(),
        time: new Date().toLocaleTimeString('ar-IQ')
      };

      db.ref('active_records').push(payload).then(() => {
        alert('✅ تم تسجيل الدخول بنجاح وإرسال السجل للمنصة الرئيسية!');
        document.getElementById('g-name').value = '';
        document.getElementById('g-num').value = '';
        document.getElementById('g-cargo').value = '';
        document.getElementById('g-dest').value = '';
        checkBannedStatus();
      }).catch(err => {
        alert('حدث خطأ أثناء الاتصال بالمنصة: ' + err.message);
      });
    });

    // التهيئة الأولية عند الفتح
    window.onload = () => {
      updateGateFields();
    };
  </script>
</body>
</html>
